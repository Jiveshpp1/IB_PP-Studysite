<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Assignments — Study Space</title><link rel="stylesheet" href="css/styles.css"><script src="common.js" defer></script><script src="assignments.js" defer></script></head>
<body class="app-page"><aside class="sidebar" id="appSidebar"></aside><div class="app-main"><header class="app-topbar"><button class="menu-button" id="menuToggle" aria-label="Toggle navigation">☰</button><div class="breadcrumb">Study Space <span>/</span> Assignments</div><div class="topbar-user"><span class="avatar" id="userAvatar">S</span><span id="userDisplayName">Student</span><button id="logoutButton" class="logout-button" type="button">Log out</button></div></header><main class="page-content"><div class="page-heading"><div><span class="eyebrow">YOUR WORKSPACE</span><h1>Assignments</h1><p>Keep track of work and due dates.</p></div><a class="button button-quiet" href="calendar.html">Open calendar →</a></div><div class="content-grid"><section class="panel"><div class="panel-heading"><div><h2>Assignments</h2><p>Mark tasks complete as you finish.</p></div></div><div id="assignmentList" class="list-stack"></div></section><section class="panel"><div class="panel-heading"><div><h2>Add an assignment</h2><p>Set a title, due date, and optional class.</p></div></div><form id="assignmentForm" class="form-stack"><label for="assignmentTitle">Title</label><input id="assignmentTitle" maxlength="180" required placeholder="e.g. Read chapter 5"><label for="assignmentDescription">Description</label><textarea id="assignmentDescription" rows="3"></textarea><label for="assignmentDue">Due date and time</label><input id="assignmentDue" type="datetime-local" required><label for="assignmentClass">Class</label><select id="assignmentClass"><option value="">No class</option></select><button class="button button-primary" type="submit">Add assignment</button><p id="assignmentMessage" class="form-message" role="status"></p></form></section></div></main></div></body></html>
