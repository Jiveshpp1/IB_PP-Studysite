<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI Chat — Study Space</title><link rel="stylesheet" href="css/styles.css"><script src="common.js" defer></script><script src="ai-chat.js" defer></script></head>
<body class="app-page"><aside class="sidebar" id="appSidebar"></aside><div class="app-main"><header class="app-topbar"><button class="menu-button" id="menuToggle" aria-label="Toggle navigation">☰</button><div class="breadcrumb">Study Space <span>/</span> AI Chat</div><div class="topbar-user"><span class="avatar" id="userAvatar">S</span><span id="userDisplayName">Student</span><button id="logoutButton" class="logout-button" type="button">Log out</button></div></header><main class="page-content"><div class="page-heading"><div><span class="eyebrow">STUDY TOOLS</span><h1>AI Chat</h1><p>Ask questions and learn concepts step by step.</p></div><button id="newChat" class="button button-primary" type="button">＋ New conversation</button></div><p id="aiConfigNotice" class="small-note"></p><div class="chat-layout"><section class="panel chat-history"><div class="panel-heading"><h2>Conversations</h2></div><div id="chatList" class="list-stack"></div></section><section class="panel"><div class="panel-heading"><div><h2 id="chatTitle">Choose a conversation</h2><p>AI chat does not use notebook files yet.</p></div></div><div id="chatMessages" class="chat-messages"><div class="empty-state"><strong>Start a conversation</strong><p>Create a new chat to begin.</p></div></div><form id="chatForm" class="chat-composer"><textarea id="chatInput" rows="2" maxlength="10000" placeholder="Ask a study question…" required></textarea><button class="button button-primary" type="submit">Send</button></form><p id="chatMessage" class="form-message" role="status"></p></section></div></main></div></body></html>
