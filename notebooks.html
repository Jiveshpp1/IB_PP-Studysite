<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Notebooks — Study Space</title><link rel="stylesheet" href="css/styles.css"><script src="common.js" defer></script><script src="notebooks.js" defer></script></head>
<body class="app-page"><aside class="sidebar" id="appSidebar"></aside><div class="app-main"><header class="app-topbar"><button class="menu-button" id="menuToggle" aria-label="Toggle navigation">☰</button><div class="breadcrumb">Study Space <span>/</span> Notebooks</div><div class="topbar-user"><span class="avatar" id="userAvatar">S</span><span id="userDisplayName">Student</span><button id="logoutButton" class="logout-button" type="button">Log out</button></div></header><main class="page-content"><div class="page-heading"><div><span class="eyebrow">YOUR WORKSPACE</span><h1>Notebooks</h1><p>Keep source materials and notes organized by subject.</p></div></div><div class="content-grid"><section class="panel"><div class="panel-heading"><div><h2>Your notebooks</h2><p>Open a notebook to manage sources, notes, and study chats.</p></div></div><div id="notebookList" class="materials-grid"></div></section><section class="panel form-panel"><div class="panel-heading"><div><h2>Create a notebook</h2><p>Choose a title and optional class.</p></div></div><form id="notebookForm" class="form-stack"><label for="notebookTitle">Notebook name</label><input id="notebookTitle" maxlength="150" required placeholder="e.g. Cell Biology"><label for="notebookClass">Class</label><select id="notebookClass"><option value="">No class</option></select><button class="button button-primary button-full" type="submit">Create notebook</button><p id="notebookMessage" class="form-message" role="status"></p></form></section></div></main></div></body></html>
