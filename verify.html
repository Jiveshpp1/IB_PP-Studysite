<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Verify email — Study Space</title><link rel="stylesheet" href="css/styles.css"><script src="common.js" defer></script><script src="auth.js" defer></script></head>
<body class="auth-page"><a class="brand auth-brand" href="index.html"><span class="brand-mark">S</span><span>Study Space</span></a><main class="auth-layout"><section class="auth-card"><span class="eyebrow">ONE LAST STEP</span><h1>Check your inbox.</h1><p class="muted">Enter the 6-digit code we emailed you.</p><form id="verifyForm" class="form-stack"><label for="verifyEmail">Email address</label><input id="verifyEmail" type="email" required autocomplete="email"><label for="verifyCode">Verification code</label><input id="verifyCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"><button class="button button-primary button-full" type="submit">Verify email</button><p id="verifyMessage" class="form-message" role="status"></p></form><button class="link-button" id="resendCode" type="button">Resend code</button></section><aside class="auth-aside"><div class="aside-orb">S</div><h2>Your space is almost ready.</h2><p>Verify your email to keep your study workspace private and secure.</p></aside></main></body></html>
