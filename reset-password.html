<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Choose a new password — Study Space</title><link rel="stylesheet" href="css/styles.css"><script src="common.js" defer></script><script src="auth.js" defer></script></head>
<body class="auth-page"><a class="brand auth-brand" href="index.html"><span class="brand-mark">S</span><span>Study Space</span></a><main class="auth-layout"><section class="auth-card"><span class="eyebrow">ACCOUNT RECOVERY</span><h1>Choose a new password.</h1><p class="muted">Enter the code from your email and a new password.</p><form id="resetForm" class="form-stack"><label for="resetEmail">Email address</label><input id="resetEmail" type="email" required autocomplete="email"><label for="resetCode">Reset code</label><input id="resetCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required><label for="resetPassword">New password</label><input id="resetPassword" type="password" minlength="8" maxlength="128" required autocomplete="new-password"><button class="button button-primary button-full" type="submit">Update password</button><p id="resetMessage" class="form-message" role="status"></p></form></section><aside class="auth-aside"><div class="aside-orb">S</div><h2>A fresh start, securely.</h2><p>Choose a password you haven’t used on another site.</p></aside></main></body></html>
