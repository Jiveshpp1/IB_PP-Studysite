<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Flashcards — Study Space</title><link rel="stylesheet" href="css/styles.css"><script src="common.js" defer></script><script src="flashcards.js" defer></script></head>
<body class="app-page"><aside class="sidebar" id="appSidebar"></aside><div class="app-main"><header class="app-topbar"><button class="menu-button" id="menuToggle" aria-label="Toggle navigation">☰</button><div class="breadcrumb">Study Space <span>/</span> Flashcards</div><div class="topbar-user"><span class="avatar" id="userAvatar">S</span><span id="userDisplayName">Student</span><button id="logoutButton" class="logout-button" type="button">Log out</button></div></header><main class="page-content"><div class="page-heading"><div><span class="eyebrow">STUDY TOOLS</span><h1>Flashcards</h1><p>Create sets, add cards, and review at your own pace.</p></div></div><div class="content-grid"><section class="panel"><div class="panel-heading"><div><h2>Create a set</h2><p>Group cards by class or topic.</p></div></div><form id="setForm" class="form-stack"><label for="setTitle">Set name</label><input id="setTitle" maxlength="150" required placeholder="e.g. Biology: Cell Structure"><label for="setClass">Class (optional)</label><select id="setClass"><option value="">No class</option></select><button class="button button-primary" type="submit">Create set</button><p id="setMessage" class="form-message" role="status"></p></form></section><section class="panel"><div class="panel-heading"><div><h2>Add a card</h2><p>Choose a set and add a question-answer pair.</p></div></div><form id="cardForm" class="form-stack"><label for="cardSet">Flashcard set</label><select id="cardSet" required></select><label for="cardTerm">Front</label><input id="cardTerm" maxlength="500" required placeholder="Term or question"><label for="cardDefinition">Back</label><textarea id="cardDefinition" rows="3" required placeholder="Definition or answer"></textarea><button class="button button-primary" type="submit">Add card</button><p id="cardMessage" class="form-message" role="status"></p></form></section></div><section class="panel" style="margin-top:18px"><div class="panel-heading"><div><h2>Your sets</h2><p>Review and manage your cards.</p></div></div><div id="setList" class="materials-grid"></div><p id="setsMessage" class="form-message" role="status"></p></section></main></div></body></html>
