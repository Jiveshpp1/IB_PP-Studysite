<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Add source — Study Space</title><link rel="stylesheet" href="css/styles.css"><script src="common.js" defer></script><script src="upload.js" defer></script></head>
<body class="app-page"><aside class="sidebar" id="appSidebar"></aside><div class="app-main"><header class="app-topbar"><button class="menu-button" id="menuToggle" aria-label="Toggle navigation">☰</button><div class="breadcrumb"><a href="notebooks.html">Notebooks</a> <span>/</span> Add source</div><div class="topbar-user"><span class="avatar" id="userAvatar">S</span><span id="userDisplayName">Student</span><button id="logoutButton" class="logout-button" type="button">Log out</button></div></header><main class="page-content"><div class="page-heading"><div><span class="eyebrow">YOUR WORKSPACE</span><h1>Add a source</h1><p>Save a document or text in one of your notebooks.</p></div></div><section class="panel" style="max-width:760px"><form id="addMaterialForm" class="form-stack"><label for="materialTitle">Title</label><input id="materialTitle" maxlength="150" required placeholder="e.g. Chapter 4 review"><label for="materialNotebook">Notebook</label><select id="materialNotebook" required><option value="">Loading notebooks…</option></select><label for="materialNotes">Paste text (optional)</label><textarea id="materialNotes" rows="6" placeholder="Paste text to save with the source"></textarea><label for="materialFile">Document (PDF, TXT, DOCX; max 5 MB)</label><input id="materialFile" type="file" accept=".pdf,.txt,.docx"><p class="small-note">Files are stored privately in your Study Space database. PDF text extraction and AI document conversations are not included yet.</p><button class="button button-primary" type="submit">Save source</button><p id="materialFormMessage" class="form-message" role="status"></p></form></section></main></div></body></html>
