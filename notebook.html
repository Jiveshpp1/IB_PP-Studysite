<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Notebook — Study Space</title><link rel="stylesheet" href="css/styles.css"><script src="common.js" defer></script><script src="notebook.js" defer></script></head>
<body class="app-page"><aside class="sidebar" id="appSidebar"></aside><div class="app-main"><header class="app-topbar"><button class="menu-button" id="menuToggle" aria-label="Toggle navigation">☰</button><div class="breadcrumb"><a href="notebooks.html">Notebooks</a> <span>/</span> <span id="notebookBreadcrumb">Notebook</span></div><div class="topbar-user"><span class="avatar" id="userAvatar">S</span><span id="userDisplayName">Student</span><button id="logoutButton" class="logout-button" type="button">Log out</button></div></header><main class="page-content"><div class="page-heading"><div><span class="eyebrow">STUDY WORKSPACE</span><h1 id="notebookTitle">Notebook</h1><p>Sources, notes, and questions together.</p></div></div><div class="content-grid"><section class="panel"><div class="panel-heading"><div><h2>Sources</h2><p>Add study documents or text notes.</p></div></div><form id="sourceForm" class="form-stack"><label for="sourceTitle">Source title</label><input id="sourceTitle" maxlength="150" required placeholder="e.g. Chapter 4 notes"><label for="sourceContent">Paste text (optional)</label><textarea id="sourceContent" rows="4" placeholder="Paste text to keep alongside the source"></textarea><label for="sourceFile">Or upload a document (PDF, TXT, DOCX; max 5 MB)</label><input id="sourceFile" type="file" accept=".pdf,.txt,.docx"><button class="button button-primary" type="submit">Add source</button><p id="sourceMessage" class="form-message" role="status"></p></form><div id="sourceList" class="list-stack"></div></section><section class="panel"><div class="panel-heading"><div><h2>Notes</h2><p>Capture what you want to remember.</p></div></div><form id="noteForm" class="form-stack"><label for="noteTitle">Note title</label><input id="noteTitle" maxlength="150" required placeholder="Key ideas"><label for="noteContent">Note</label><textarea id="noteContent" rows="5" placeholder="Write your notes…" required></textarea><button class="button button-primary" type="submit">Save note</button><p id="noteMessage" class="form-message" role="status"></p></form><div id="noteList" class="list-stack"></div></section></div><section class="panel" style="margin-top:18px"><div class="panel-heading"><div><h2>Notebook chat</h2><p>Start a conversation about this notebook. AI responses require an API key.</p></div><button id="newNotebookChat" class="button button-primary" type="button">New chat</button></div><div id="notebookChats" class="list-stack"></div><p id="chatMessage" class="form-message" role="status"></p></section></main></div></body></html>
