<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Calendar — Study Space</title><link rel="stylesheet" href="css/styles.css"><script src="common.js" defer></script><script src="calendar.js" defer></script></head>
<body class="app-page"><aside class="sidebar" id="appSidebar"></aside><div class="app-main"><header class="app-topbar"><button class="menu-button" id="menuToggle" aria-label="Toggle navigation">☰</button><div class="breadcrumb">Study Space <span>/</span> Calendar</div><div class="topbar-user"><span class="avatar" id="userAvatar">S</span><span id="userDisplayName">Student</span><button id="logoutButton" class="logout-button" type="button">Log out</button></div></header><main class="page-content"><div class="page-heading"><div><span class="eyebrow">YOUR WORKSPACE</span><h1>Calendar</h1><p>Assignments and events by month.</p></div></div><section class="panel"><div class="panel-heading"><button id="previousMonth" class="button button-quiet" type="button">← Previous</button><h2 id="calendarMonth"></h2><button id="nextMonth" class="button button-quiet" type="button">Next →</button></div><div class="calendar-grid" id="calendarGrid"></div></section><div class="content-grid"><section class="panel"><div class="panel-heading"><div><h2>Add calendar event</h2><p>Save a test, meeting, or reminder.</p></div></div><form id="eventForm" class="form-stack"><label for="eventTitle">Event name</label><input id="eventTitle" maxlength="180" required><label for="eventDescription">Description</label><textarea id="eventDescription" rows="2"></textarea><label for="eventStart">Starts</label><input id="eventStart" type="datetime-local" required><label for="eventEnd">Ends (optional)</label><input id="eventEnd" type="datetime-local"><button class="button button-primary" type="submit">Add event</button><p id="calendarMessage" class="form-message" role="status"></p></form></section><section class="panel"><div class="panel-heading"><div><h2>Events</h2><p>Delete events you no longer need.</p></div></div><div id="eventList" class="list-stack"></div></section></div></main></div></body></html>
