<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quizzes — Study Space</title><link rel="stylesheet" href="css/styles.css"><script src="common.js" defer></script><script src="quizzes.js" defer></script></head>
<body class="app-page"><aside class="sidebar" id="appSidebar"></aside><div class="app-main"><header class="app-topbar"><button class="menu-button" id="menuToggle" aria-label="Toggle navigation">☰</button><div class="breadcrumb">Study Space <span>/</span> Quizzes</div><div class="topbar-user"><span class="avatar" id="userAvatar">S</span><span id="userDisplayName">Student</span><button id="logoutButton" class="logout-button" type="button">Log out</button></div></header><main class="page-content"><div class="page-heading"><div><span class="eyebrow">STUDY TOOLS</span><h1>Quizzes</h1><p>Write practice questions and check what you know.</p></div></div><div class="content-grid"><section class="panel"><div class="panel-heading"><div><h2>Create a quiz</h2><p>Start a new multiple-choice quiz.</p></div></div><form id="quizForm" class="form-stack"><label for="quizTitle">Quiz name</label><input id="quizTitle" maxlength="150" required placeholder="e.g. Cell Biology Review"><label for="quizClass">Class</label><select id="quizClass"><option value="">No class</option></select><button class="button button-primary" type="submit">Create quiz</button><p id="quizMessage" class="form-message" role="status"></p></form></section><section class="panel"><div class="panel-heading"><div><h2>Add a question</h2><p>Add a question and up to four answer choices.</p></div></div><form id="questionForm" class="form-stack"><label for="questionQuiz">Quiz</label><select id="questionQuiz" required></select><label for="questionPrompt">Question</label><textarea id="questionPrompt" rows="2" required maxlength="2000"></textarea><div class="form-grid"><div><label for="option0">Option A</label><input id="option0" required maxlength="250"></div><div><label for="option1">Option B</label><input id="option1" required maxlength="250"></div><div><label for="option2">Option C (optional)</label><input id="option2" maxlength="250"></div><div><label for="option3">Option D (optional)</label><input id="option3" maxlength="250"></div></div><label for="correctOption">Correct answer</label><select id="correctOption"><option value="0">Option A</option><option value="1">Option B</option><option value="2">Option C</option><option value="3">Option D</option></select><button class="button button-primary" type="submit">Add question</button><p id="questionMessage" class="form-message" role="status"></p></form></section></div><section class="panel" style="margin-top:18px"><div class="panel-heading"><div><h2>Your quizzes</h2><p>Open a quiz to take it or manage its questions.</p></div></div><div id="quizList" class="materials-grid"></div><p id="quizListMessage" class="form-message" role="status"></p></section></main></div></body></html>
